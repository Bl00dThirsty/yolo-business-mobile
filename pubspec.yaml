name: yolo_business_mobile
description: Application mobile des entreprises et vendeurs YOLO Business.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: 2.18.3
  iconsax: 0.0.8
  intl: 0.20.3
  flutter_map: 8.3.2
  latlong2: 0.9.1
  uuid: 4.5.1
  flutter_secure_storage: 9.2.4
  url_launcher: 6.3.2
  # Keep plugin implementations while native hook spawning hangs on this
  # Windows toolchain. Both satisfy path_provider's platform constraints.
  path_provider_android: 2.2.23
  path_provider_foundation: 2.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.3

flutter_launcher_icons:
  android: true
  image_path: "assets/brand/x-yolo-business-white-android-icon.png"
  adaptive_icon_background: "#034bff"
  adaptive_icon_foreground: "assets/brand/x-yolo-business-white-android-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/
  fonts:
    - family: Barlow Semi Condensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Regular.ttf
        - asset: assets/fonts/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Bold.ttf
          weight: 700
